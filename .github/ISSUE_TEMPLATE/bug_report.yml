name: Bug report
description: Report a reproducible FIFA 14 Local FUT problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not upload EA game executables/DLLs, account credentials, private keys, or other sensitive files.

        **Before filing:** run `DIAGNOSE.cmd`. It checks the things that cause most
        startup and connection reports (missing dependencies, a port already in
        use, no OpenSSL, an unreadable game folder) and writes
        `diagnostics-report.txt`. Personal paths and your Windows user name are
        redacted, so the report is safe to paste. It often tells you the fix
        outright.
  - type: input
    id: version
    attributes:
      label: Build version
      placeholder: v2.41.1-beta2.25.9
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 10 22H2 / Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where does it fail?
      options:
        - Prerequisites / setup
        - Local server startup
        - Entering FUT
        - Store / packs
        - Transfer market
        - Squad / consumables
        - Match / post-match
        - Seasons / tournaments
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: Tell us exactly what you clicked/ran and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: DIAGNOSE.cmd report
      description: Paste the contents of diagnostics-report.txt. It is already redacted.
      render: shell

  - type: textarea
    id: error
    attributes:
      label: Error / diagnostics
      description: Paste the relevant error text or sanitized diagnostic output.
      render: shell
